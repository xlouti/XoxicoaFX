name: Build Xoxicoa FX for Mac
on:
  workflow_dispatch:
  push:
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build-mac.yml'
concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mac-universal:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal arm64 + x86_64)
        run: >-
          cmake -S . -B build-mac -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Build AU, VST3 and Standalone
        run: cmake --build build-mac --config Release --parallel 3
      - name: Sign ad-hoc, verify architectures, package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="build-mac/XoxicoaFX_artefacts/Release"
          mkdir -p package
          ditto "$ROOT/AU/Xoxicoa FX.component" "package/Xoxicoa FX.component"
          ditto "$ROOT/VST3/Xoxicoa FX.vst3" "package/Xoxicoa FX.vst3"
          ditto "$ROOT/Standalone/Xoxicoa FX.app" "package/Xoxicoa FX.app"
          for b in "package/Xoxicoa FX.component" "package/Xoxicoa FX.vst3" "package/Xoxicoa FX.app"; do
            codesign --force --deep --sign - "$b"
            lipo "$b/Contents/MacOS/Xoxicoa FX" -verify_arch arm64 x86_64
            lipo -info "$b/Contents/MacOS/Xoxicoa FX"
            bin="$b/Contents/MacOS/Xoxicoa FX"
            echo "---- minos x86_64 ----"
            vtool -arch x86_64 -show-build "$bin"
            echo "---- minos arm64 ----"
            vtool -arch arm64 -show-build "$bin"
            x86min=$(vtool -arch x86_64 -show-build "$bin" | awk '/minos/ { print $2; exit }')
            case "$x86min" in
              10.15|10.15.0) ;;
              *) echo "x86_64 minos is '${x86min}', expected 10.15"; exit 1 ;;
            esac
          done
          cp BUILD_ON_MAC.md SPEC.md package/
          ditto -c -k --sequesterRsrc --keepParent package XoxicoaFX_mac_universal.zip
      - name: Validate AU (informational)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          ditto "package/Xoxicoa FX.component" ~/Library/Audio/Plug-Ins/Components/"Xoxicoa FX.component"
          killall -9 AudioComponentRegistrar || true
          auval -v aufx XxFx Xoxi
      - uses: actions/upload-artifact@v4
        with:
          name: XoxicoaFX_mac_universal
          path: XoxicoaFX_mac_universal.zip
          retention-days: 30
